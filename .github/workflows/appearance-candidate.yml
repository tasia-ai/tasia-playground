name: Appearance candidate build and tests

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch or commit in tasia-ai/tasia-rust
        required: true
        default: fix/tasia-profile-marks-foundation
        type: string

permissions:
  contents: read

jobs:
  candidate:
    name: ${{ matrix.name }} build and workspace tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-24.04
          - name: macOS x64
            os: macos-15-intel
          - name: macOS arm64
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - name: Check out the selected Tasia source
        uses: actions/checkout@v7
        with:
          repository: tasia-ai/tasia-rust
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.TASIA_SOURCE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 0

      - name: Install Linux viewer dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev

      - name: Rust stable
        run: |
          rustup update stable --no-self-update
          rustup component add rustfmt

      - name: Formatting
        run: cargo +stable fmt --all -- --check

      - name: Build viewer
        run: cargo +stable build --release --locked -p aurora-viewer

      - name: Workspace tests
        run: cargo +stable test --locked --workspace

      - name: Test storage uploader
        run: python3 -m unittest discover -s scripts -p test_storage_to_upload.py

      - name: Package candidate without publishing
        shell: pwsh
        run: |
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          $exe = "target/release/aurora-viewer$suffix"
          if (-not (Test-Path -LiteralPath $exe)) { $exe = "target/release/tasia-viewer$suffix" }
          if (-not (Test-Path -LiteralPath $exe)) { throw 'Viewer executable missing' }
          $out = Join-Path $env:RUNNER_TEMP 'Tasia-candidate'
          if ($IsMacOS) {
            $app = Join-Path $out 'Tasia Viewer.app'
            ./scripts/package-macos.ps1 -Exe $exe -Out $app
            if (-not $?) { throw 'macOS packaging failed' }
            & codesign --force --sign - $app
            if ($LASTEXITCODE -ne 0) { throw 'Signing failed' }
            & codesign --verify --strict $app
            if ($LASTEXITCODE -ne 0) { throw 'Signature verification failed' }
            & ditto -c -k --keepParent $app (Join-Path $env:RUNNER_TEMP 'Tasia-candidate.zip')
            if ($LASTEXITCODE -ne 0) { throw 'ZIP failed' }
          } else {
            ./scripts/package.ps1 -Exe $exe -Out $out
            if (-not $?) { throw 'Packaging failed' }
            if ($IsWindows) {
              Compress-Archive -Path $out -DestinationPath (Join-Path $env:RUNNER_TEMP 'Tasia-candidate.zip')
            } else {
              & tar -czf (Join-Path $env:RUNNER_TEMP 'Tasia-candidate.tar.gz') -C $env:RUNNER_TEMP Tasia-candidate
              if ($LASTEXITCODE -ne 0) { throw 'Archive failed' }
            }
          }
          Get-ChildItem -LiteralPath $env:RUNNER_TEMP -File -Filter 'Tasia-candidate.*' | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Set-Content -LiteralPath "$($_.FullName).sha256" -Encoding utf8NoBOM
          }

      # The source is private; do not upload binaries to public Actions artifacts.
      - name: Record tested revision
        shell: pwsh
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          "Platform: ``${{ matrix.name }}``" | Add-Content $env:GITHUB_STEP_SUMMARY
          "Source: ``tasia-ai/tasia-rust@$env:SOURCE_REF``" | Add-Content $env:GITHUB_STEP_SUMMARY
          "Commit: ``$(git rev-parse HEAD)``" | Add-Content $env:GITHUB_STEP_SUMMARY
