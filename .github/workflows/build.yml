name: Tasia Viewer platform builds

on:
  workflow_dispatch:
    inputs:
      storage_test_only:
        description: Run only the small artifact API connectivity test
        required: true
        type: boolean
        default: false
      storage_branch:
        description: Release Center branch route to test
        required: true
        type: string
        default: main

permissions:
  contents: read

jobs:
  storage-api-test:
    name: Storage API connectivity test
    if: ${{ inputs.storage_test_only == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Upload test artifact
        shell: bash
        env:
          STORAGE_URL: ${{ secrets.STORAGE_URL }}
          STORAGE_TOKEN: ${{ secrets.STORAGE_TOKEN }}
          STORAGE_BRANCH: ${{ inputs.storage_branch }}
        run: |
          set -euo pipefail
          if [[ -z "${STORAGE_URL:-}" ]]; then
            echo 'Set the STORAGE_URL Actions secret before running this test.' >&2
            exit 1
          fi
          if [[ -z "${STORAGE_TOKEN:-}" ]]; then
            echo 'Set the STORAGE_TOKEN Actions secret before running this test.' >&2
            exit 1
          fi

          filename='storage-api-test.txt'
          test_file="$RUNNER_TEMP/$filename"
          printf 'Tasia Viewer artifact API connectivity test.\n' > "$test_file"
          upload_url="${STORAGE_URL%/}/artifacts/$GITHUB_REPOSITORY/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/$filename"
          status="$(curl --fail-with-body --silent --show-error --output /dev/null --write-out '%{http_code}' \
            -H "Authorization: Bearer $STORAGE_TOKEN" \
            -H "X-Storage-Branch: $STORAGE_BRANCH" \
            -H 'X-Storage-Product: Tasia-Viewer' \
            --upload-file "$test_file" \
            "$upload_url")"

          if [[ ! "$status" =~ ^2[0-9]{2}$ ]]; then
            echo "Artifact API upload returned HTTP $status, expected a 2xx response." >&2
            exit 1
          fi
          echo "Artifact API test upload succeeded (HTTP $status)."
          echo 'A small test artifact was stored under this workflow run path; the workflow does not delete it.' >> "$GITHUB_STEP_SUMMARY"

  windows-x64:
    name: Windows x64
    if: ${{ inputs.storage_test_only != true }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: tasia-ai/tasia-rust
          ref: main
          token: ${{ secrets.TASIA_SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: source
      - name: Rust stable
        run: rustup update stable --no-self-update
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Build
        working-directory: source
        run: cargo build --release --locked -p aurora-viewer
      - name: Package
        shell: pwsh
        run: |
          ./source/scripts/package.ps1 -Exe source/target/release/tasia-viewer.exe -Out Tasia-Viewer-windows-x64 -Source source
          Compress-Archive -Path Tasia-Viewer-windows-x64 -DestinationPath Tasia-Viewer-windows-x64.zip
          $hash = (Get-FileHash -LiteralPath Tasia-Viewer-windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Tasia-Viewer-windows-x64.zip" | Set-Content -LiteralPath Tasia-Viewer-windows-x64.zip.sha256 -Encoding utf8NoBOM
      - name: Upload package to artifact API
        env:
          STORAGE_URL: ${{ secrets.STORAGE_URL }}
          STORAGE_TOKEN: ${{ secrets.STORAGE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          upload_artifact() {
            local filename="$1"
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $STORAGE_TOKEN" \
              -H "X-Storage-Branch: $GITHUB_REF_NAME" \
              -H 'X-Storage-Product: Tasia-Viewer' \
              --upload-file "$filename" \
              "${STORAGE_URL%/}/artifacts/$GITHUB_REPOSITORY/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/$filename"
          }
          upload_artifact Tasia-Viewer-windows-x64.zip
          upload_artifact Tasia-Viewer-windows-x64.zip.sha256

  linux-x64:
    name: Linux x64
    if: ${{ inputs.storage_test_only != true }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          repository: tasia-ai/tasia-rust
          ref: main
          token: ${{ secrets.TASIA_SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: source
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev
      - name: Rust stable
        run: rustup update stable --no-self-update
      - name: Build
        working-directory: source
        env:
          CARGO_PROFILE_RELEASE_STRIP: debuginfo
        run: cargo build --release --locked -p aurora-viewer
      - name: Package
        shell: pwsh
        run: |
          ./source/scripts/package.ps1 -Exe source/target/release/tasia-viewer -Out Tasia-Viewer-linux-x64 -Source source
          tar -czf Tasia-Viewer-linux-x64.tar.gz Tasia-Viewer-linux-x64
          sha256sum Tasia-Viewer-linux-x64.tar.gz > Tasia-Viewer-linux-x64.tar.gz.sha256
      - name: Upload package to artifact API
        env:
          STORAGE_URL: ${{ secrets.STORAGE_URL }}
          STORAGE_TOKEN: ${{ secrets.STORAGE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          upload_artifact() {
            local filename="$1"
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $STORAGE_TOKEN" \
              -H "X-Storage-Branch: $GITHUB_REF_NAME" \
              -H 'X-Storage-Product: Tasia-Viewer' \
              --upload-file "$filename" \
              "${STORAGE_URL%/}/artifacts/$GITHUB_REPOSITORY/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/$filename"
          }
          upload_artifact Tasia-Viewer-linux-x64.tar.gz
          upload_artifact Tasia-Viewer-linux-x64.tar.gz.sha256

  macos-x64:
    name: macOS x64
    if: ${{ inputs.storage_test_only != true }}
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7
        with:
          repository: tasia-ai/tasia-rust
          ref: main
          token: ${{ secrets.TASIA_SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: source
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          repository: tasia-ai/tasia-playground
          ref: main
          persist-credentials: false
          path: playground
      - name: Rust stable and target
        run: rustup update stable --no-self-update && rustup target add x86_64-apple-darwin
      - name: Build
        working-directory: source
        env:
          CARGO_PROFILE_RELEASE_STRIP: debuginfo
        run: cargo build --release --locked --target x86_64-apple-darwin -p aurora-viewer
      - name: Package app
        shell: bash
        run: bash ./playground/scripts/package-macos-playground.sh x86_64-apple-darwin x64
      - name: Upload package to artifact API
        env:
          STORAGE_URL: ${{ secrets.STORAGE_URL }}
          STORAGE_TOKEN: ${{ secrets.STORAGE_TOKEN }}
        shell: bash
        run: |
          shasum -a 256 Tasia-Viewer-macos-x64.zip > Tasia-Viewer-macos-x64.zip.sha256
          set -euo pipefail
          upload_artifact() {
            local filename="$1"
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $STORAGE_TOKEN" \
              -H "X-Storage-Branch: $GITHUB_REF_NAME" \
              -H 'X-Storage-Product: Tasia-Viewer' \
              --upload-file "$filename" \
              "${STORAGE_URL%/}/artifacts/$GITHUB_REPOSITORY/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/$filename"
          }
          upload_artifact Tasia-Viewer-macos-x64.zip
          upload_artifact Tasia-Viewer-macos-x64.zip.sha256

  macos-arm64:
    name: macOS arm64
    if: ${{ inputs.storage_test_only != true }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          repository: tasia-ai/tasia-rust
          ref: main
          token: ${{ secrets.TASIA_SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: source
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          repository: tasia-ai/tasia-playground
          ref: main
          persist-credentials: false
          path: playground
      - name: Rust stable and target
        run: rustup update stable --no-self-update && rustup target add aarch64-apple-darwin
      - name: Build
        working-directory: source
        env:
          CARGO_PROFILE_RELEASE_STRIP: debuginfo
        run: cargo build --release --locked --target aarch64-apple-darwin -p aurora-viewer
      - name: Package app
        shell: bash
        run: bash ./playground/scripts/package-macos-playground.sh aarch64-apple-darwin arm64
      - name: Upload package to artifact API
        env:
          STORAGE_URL: ${{ secrets.STORAGE_URL }}
          STORAGE_TOKEN: ${{ secrets.STORAGE_TOKEN }}
        shell: bash
        run: |
          shasum -a 256 Tasia-Viewer-macos-arm64.zip > Tasia-Viewer-macos-arm64.zip.sha256
          set -euo pipefail
          upload_artifact() {
            local filename="$1"
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $STORAGE_TOKEN" \
              -H "X-Storage-Branch: $GITHUB_REF_NAME" \
              -H 'X-Storage-Product: Tasia-Viewer' \
              --upload-file "$filename" \
              "${STORAGE_URL%/}/artifacts/$GITHUB_REPOSITORY/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/$filename"
          }
          upload_artifact Tasia-Viewer-macos-arm64.zip
          upload_artifact Tasia-Viewer-macos-arm64.zip.sha256
