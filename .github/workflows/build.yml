name: Tasia Viewer platform builds

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag, or commit to build from tasia-ai/tasia-rust
        required: true
        default: main
        type: string

permissions:
  contents: read

jobs:
  windows-x64:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: tasia-ai/tasia-rust
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.TASIA_SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: source
      - name: Rust stable
        run: rustup update stable --no-self-update
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Build
        working-directory: source
        run: cargo build --release --locked -p aurora-viewer
      - name: Package
        shell: pwsh
        run: |
          ./source/scripts/package.ps1 -Exe source/target/release/tasia-viewer.exe -Out Tasia-Viewer-windows-x64 -Source source
          Compress-Archive -Path Tasia-Viewer-windows-x64 -DestinationPath Tasia-Viewer-windows-x64.zip
          $hash = (Get-FileHash -LiteralPath Tasia-Viewer-windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Tasia-Viewer-windows-x64.zip" | Set-Content -LiteralPath Tasia-Viewer-windows-x64.zip.sha256 -Encoding utf8NoBOM
      - name: Upload package to storage.to
        env:
          STORAGE_TO_TOKEN: ${{ secrets.STORAGE_TO_TOKEN }}
        run: |
          python source/scripts/storage_to_upload.py --directory . --output storage-to-urls-windows.json
          if ($LASTEXITCODE -ne 0) { throw 'storage.to upload failed' }
          Get-Content storage-to-urls-windows.json | Add-Content $env:GITHUB_STEP_SUMMARY

  linux-x64:
    name: Linux x64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          repository: tasia-ai/tasia-rust
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.TASIA_SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: source
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev
      - name: Rust stable
        run: rustup update stable --no-self-update
      - name: Build
        working-directory: source
        env:
          CARGO_PROFILE_RELEASE_STRIP: debuginfo
        run: cargo build --release --locked -p aurora-viewer
      - name: Package
        shell: pwsh
        run: |
          ./source/scripts/package.ps1 -Exe source/target/release/tasia-viewer -Out Tasia-Viewer-linux-x64 -Source source
          tar -czf Tasia-Viewer-linux-x64.tar.gz Tasia-Viewer-linux-x64
          sha256sum Tasia-Viewer-linux-x64.tar.gz > Tasia-Viewer-linux-x64.tar.gz.sha256
      - name: Upload package to storage.to
        env:
          STORAGE_TO_TOKEN: ${{ secrets.STORAGE_TO_TOKEN }}
        run: |
          python3 source/scripts/storage_to_upload.py --directory . --output storage-to-urls-linux.json
          cat storage-to-urls-linux.json >> "$GITHUB_STEP_SUMMARY"

  macos-x64:
    name: macOS x64
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7
        with:
          repository: tasia-ai/tasia-rust
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.TASIA_SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: source
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          repository: tasia-ai/tasia-playground
          ref: ${{ github.ref_name }}
          persist-credentials: false
          path: playground
      - name: Rust stable and target
        run: rustup update stable --no-self-update && rustup target add x86_64-apple-darwin
      - name: Build
        working-directory: source
        env:
          CARGO_PROFILE_RELEASE_STRIP: debuginfo
        run: cargo build --release --locked --target x86_64-apple-darwin -p aurora-viewer
      - name: Package app
        shell: bash
        run: bash ./playground/scripts/package-macos-playground.sh x86_64-apple-darwin x64
      - name: Upload package to storage.to
        env:
          STORAGE_TO_TOKEN: ${{ secrets.STORAGE_TO_TOKEN }}
        run: |
          shasum -a 256 Tasia-Viewer-macos-x64.zip > Tasia-Viewer-macos-x64.zip.sha256
          python3 source/scripts/storage_to_upload.py --directory . --output storage-to-urls-macos-x64.json
          cat storage-to-urls-macos-x64.json >> "$GITHUB_STEP_SUMMARY"

  macos-arm64:
    name: macOS arm64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          repository: tasia-ai/tasia-rust
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.TASIA_SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: source
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          repository: tasia-ai/tasia-playground
          ref: ${{ github.ref_name }}
          persist-credentials: false
          path: playground
      - name: Rust stable and target
        run: rustup update stable --no-self-update && rustup target add aarch64-apple-darwin
      - name: Build
        working-directory: source
        env:
          CARGO_PROFILE_RELEASE_STRIP: debuginfo
        run: cargo build --release --locked --target aarch64-apple-darwin -p aurora-viewer
      - name: Package app
        shell: bash
        run: bash ./playground/scripts/package-macos-playground.sh aarch64-apple-darwin arm64
      - name: Upload package to storage.to
        env:
          STORAGE_TO_TOKEN: ${{ secrets.STORAGE_TO_TOKEN }}
        run: |
          shasum -a 256 Tasia-Viewer-macos-arm64.zip > Tasia-Viewer-macos-arm64.zip.sha256
          python3 source/scripts/storage_to_upload.py --directory . --output storage-to-urls-macos-arm64.json
          cat storage-to-urls-macos-arm64.json >> "$GITHUB_STEP_SUMMARY"
