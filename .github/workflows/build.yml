name: Tasia Viewer platform builds

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag, or commit to build from tasia-ai/tasia-rust
        required: true
        default: main
        type: string
      platform:
        description: Build all platforms or only one target
        required: true
        default: all
        type: choice
        options:
          - all
          - windows-x64
          - linux-x64
          - macos-x64
          - macos-arm64

permissions:
  contents: read

jobs:
  windows-x64:
    name: Windows x64
    if: ${{ inputs.platform == 'all' || inputs.platform == 'windows-x64' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: tasia-ai/tasia-rust
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.TASIA_SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: source
          fetch-depth: 0
          fetch-tags: true
      - name: Restore source version anchor
        shell: bash
        working-directory: source
        run: |
          version_anchor='e03653c3c17219c8429394ec1bc126b515128572'
          if ! git merge-base --is-ancestor "$version_anchor" HEAD; then
            echo 'Source ref predates the v1.0.0 version anchor; using its fetched tags.'
            exit 0
          fi
          if git show-ref --verify --quiet refs/tags/v1.0.0; then
            test "$(git rev-parse 'v1.0.0^{commit}')" = "$version_anchor"
          else
            git tag v1.0.0 "$version_anchor"
          fi
          git describe --tags --match 'v[0-9]*.[0-9]*.[0-9]*' --long --abbrev=9
      - name: Rust stable
        run: rustup update stable --no-self-update
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Build
        working-directory: source
        run: cargo build --release --locked -p aurora-viewer
      - name: Verify build version
        shell: pwsh
        run: |
          $versionOutput = Join-Path $env:RUNNER_TEMP 'tasia-viewer-version.txt'
          $versionError = Join-Path $env:RUNNER_TEMP 'tasia-viewer-version.err.txt'
          $versionProcess = Start-Process `
            -FilePath (Resolve-Path -LiteralPath './source/target/release/tasia-viewer.exe').Path `
            -ArgumentList '--version' `
            -WorkingDirectory $PWD.Path `
            -RedirectStandardOutput $versionOutput `
            -RedirectStandardError $versionError `
            -NoNewWindow -Wait -PassThru
          if ($versionProcess.ExitCode -ne 0) {
            $errorText = Get-Content -LiteralPath $versionError -Raw
            throw "Could not read the built viewer version (exit code $($versionProcess.ExitCode)): $errorText"
          }
          $version = (Get-Content -LiteralPath $versionOutput -Raw).Trim()
          if ($version -notmatch '^Tasia Viewer \d+\.\d+\.\d+(?:[+-][0-9A-Za-z.-]+)?$' -or $version -match '^Tasia Viewer 0\.0\.0(?:[+-]|$)') {
            throw "Invalid or placeholder viewer version: $version"
          }
          "Windows build: $version" >> $env:GITHUB_STEP_SUMMARY
      - name: Package
        shell: pwsh
        run: |
          ./source/scripts/package.ps1 -Exe source/target/release/tasia-viewer.exe -Out Tasia-Viewer-windows-x64 -Source source
          Compress-Archive -Path Tasia-Viewer-windows-x64 -DestinationPath Tasia-Viewer-windows-x64.zip
          $hash = (Get-FileHash -LiteralPath Tasia-Viewer-windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Tasia-Viewer-windows-x64.zip" | Set-Content -LiteralPath Tasia-Viewer-windows-x64.zip.sha256 -Encoding utf8NoBOM
      - name: Upload package to storage.to
        env:
          STORAGE_TO_TOKEN: ${{ secrets.STORAGE_TO_TOKEN }}
        run: |
          python source/scripts/storage_to_upload.py --directory . --output storage-to-urls-windows.json
          if ($LASTEXITCODE -ne 0) { throw 'storage.to upload failed' }
          Get-Content storage-to-urls-windows.json | Add-Content $env:GITHUB_STEP_SUMMARY

  linux-x64:
    name: Linux x64
    if: ${{ inputs.platform == 'all' || inputs.platform == 'linux-x64' }}
    # Match the AppImage compatibility baseline (glibc 2.35).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          repository: tasia-ai/tasia-rust
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.TASIA_SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: source
          fetch-depth: 0
          fetch-tags: true
      - name: Restore source version anchor
        shell: bash
        working-directory: source
        run: |
          version_anchor='e03653c3c17219c8429394ec1bc126b515128572'
          if ! git merge-base --is-ancestor "$version_anchor" HEAD; then
            echo 'Source ref predates the v1.0.0 version anchor; using its fetched tags.'
            exit 0
          fi
          if git show-ref --verify --quiet refs/tags/v1.0.0; then
            test "$(git rev-parse 'v1.0.0^{commit}')" = "$version_anchor"
          else
            git tag v1.0.0 "$version_anchor"
          fi
          git describe --tags --match 'v[0-9]*.[0-9]*.[0-9]*' --long --abbrev=9
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev
      - name: Rust stable
        run: rustup update stable --no-self-update
      - name: Build
        working-directory: source
        env:
          CARGO_PROFILE_RELEASE_STRIP: debuginfo
        run: cargo build --release --locked -p aurora-viewer
      - name: Verify build version
        run: |
          version="$(source/target/release/tasia-viewer --version)"
          if [[ "$version" =~ ^Tasia\ Viewer\ 0\.0\.0([+-]|$) || ! "$version" =~ ^Tasia\ Viewer\ [0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid or placeholder viewer version: $version" >&2
            exit 1
          fi
          echo "Linux build: $version" >> "$GITHUB_STEP_SUMMARY"
      - name: Package
        shell: pwsh
        run: |
          ./source/scripts/package.ps1 -Exe source/target/release/tasia-viewer -Out Tasia-Viewer-linux-x64 -Source source
          tar -czf Tasia-Viewer-linux-x64.tar.gz Tasia-Viewer-linux-x64
          sha256sum Tasia-Viewer-linux-x64.tar.gz > Tasia-Viewer-linux-x64.tar.gz.sha256
      - name: Create and smoke-test AppImage
        env:
          APPIMAGETOOL_SHA256: e8c1169c4af66c3184d7ee110713d4be04befe671fa358e2c1591ee840553b03
          APPIMAGE_RUNTIME_SHA256: 617aa77314d57c8b8e4fae9c3f0b35af7b30d5529cb69e98f64f92510ed98a46
        run: |
          set -euo pipefail
          tool_dir="$(mktemp -d "$RUNNER_TEMP/appimage-tools.XXXXXX")"
          trap 'rm -rf "$tool_dir"' EXIT
          curl --fail --location --silent --show-error \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
            --output "$tool_dir/appimagetool.AppImage"
          curl --fail --location --silent --show-error \
            https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64 \
            --output "$tool_dir/appimage-runtime-x86_64"
          echo "$APPIMAGETOOL_SHA256  $tool_dir/appimagetool.AppImage" | sha256sum --check --status
          echo "$APPIMAGE_RUNTIME_SHA256  $tool_dir/appimage-runtime-x86_64" | sha256sum --check --status
          chmod 755 "$tool_dir/appimagetool.AppImage" "$tool_dir/appimage-runtime-x86_64"

          source_commit="$(git -C source rev-parse HEAD)"
          (
            cd source
            APPIMAGETOOL="$tool_dir/appimagetool.AppImage" \
              APPIMAGE_RUNTIME_FILE="$tool_dir/appimage-runtime-x86_64" \
              scripts/package-appimage.sh \
                "$GITHUB_WORKSPACE/Tasia-Viewer-linux-x64" \
                "$GITHUB_WORKSPACE/Tasia-Viewer-linux-x64.AppImage" \
                "$source_commit"
          )

          built_version="$(source/target/release/tasia-viewer --version)"
          appimage_version="$(APPIMAGE_EXTRACT_AND_RUN=1 ./Tasia-Viewer-linux-x64.AppImage --version)"
          test "$appimage_version" = "$built_version"
          extract_dir="$(mktemp -d)"
          trap 'rm -rf "$extract_dir" "$tool_dir"' EXIT
          (
            cd "$extract_dir"
            "$GITHUB_WORKSPACE/Tasia-Viewer-linux-x64.AppImage" --appimage-extract >/dev/null
          )
          embedded_commit="$(cat "$extract_dir/squashfs-root/usr/share/doc/tasia-viewer/source-commit")"
          test "$embedded_commit" = "$source_commit"
          if ldd "$extract_dir/squashfs-root/tasia-viewer" | grep -q 'not found'; then
            echo 'The AppImage has unresolved shared-library dependencies.' >&2
            ldd "$extract_dir/squashfs-root/tasia-viewer" >&2
            exit 1
          fi
      - name: Upload package to storage.to
        env:
          STORAGE_TO_TOKEN: ${{ secrets.STORAGE_TO_TOKEN }}
        run: |
          python3 source/scripts/storage_to_upload.py --directory . --output storage-to-urls-linux.json
          cat storage-to-urls-linux.json >> "$GITHUB_STEP_SUMMARY"

  macos-x64:
    name: macOS x64
    if: ${{ inputs.platform == 'all' || inputs.platform == 'macos-x64' }}
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7
        with:
          repository: tasia-ai/tasia-rust
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.TASIA_SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: source
          fetch-depth: 0
          fetch-tags: true
      - name: Restore source version anchor
        shell: bash
        working-directory: source
        run: |
          version_anchor='e03653c3c17219c8429394ec1bc126b515128572'
          if ! git merge-base --is-ancestor "$version_anchor" HEAD; then
            echo 'Source ref predates the v1.0.0 version anchor; using its fetched tags.'
            exit 0
          fi
          if git show-ref --verify --quiet refs/tags/v1.0.0; then
            test "$(git rev-parse 'v1.0.0^{commit}')" = "$version_anchor"
          else
            git tag v1.0.0 "$version_anchor"
          fi
          git describe --tags --match 'v[0-9]*.[0-9]*.[0-9]*' --long --abbrev=9
      - uses: actions/checkout@v7
        with:
          repository: tasia-ai/tasia-playground
          ref: ${{ github.ref_name }}
          persist-credentials: false
          path: playground
      - name: Rust stable and target
        run: rustup update stable --no-self-update && rustup target add x86_64-apple-darwin
      - name: Build
        working-directory: source
        env:
          CARGO_PROFILE_RELEASE_STRIP: debuginfo
        run: cargo build --release --locked --target x86_64-apple-darwin -p aurora-viewer
      - name: Verify build version
        run: |
          version="$(source/target/x86_64-apple-darwin/release/tasia-viewer --version)"
          if [[ "$version" =~ ^Tasia\ Viewer\ 0\.0\.0([+-]|$) || ! "$version" =~ ^Tasia\ Viewer\ [0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid or placeholder viewer version: $version" >&2
            exit 1
          fi
          echo "macOS x64 build: $version" >> "$GITHUB_STEP_SUMMARY"
      - name: Package app
        shell: bash
        run: bash ./playground/scripts/package-macos-playground.sh x86_64-apple-darwin x64
      - name: Upload package to storage.to
        env:
          STORAGE_TO_TOKEN: ${{ secrets.STORAGE_TO_TOKEN }}
        run: |
          shasum -a 256 Tasia-Viewer-macos-x64.zip > Tasia-Viewer-macos-x64.zip.sha256
          python3 source/scripts/storage_to_upload.py --directory . --output storage-to-urls-macos-x64.json
          cat storage-to-urls-macos-x64.json >> "$GITHUB_STEP_SUMMARY"

  macos-arm64:
    name: macOS arm64
    if: ${{ inputs.platform == 'all' || inputs.platform == 'macos-arm64' }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          repository: tasia-ai/tasia-rust
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.TASIA_SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: source
          fetch-depth: 0
          fetch-tags: true
      - name: Restore source version anchor
        shell: bash
        working-directory: source
        run: |
          version_anchor='e03653c3c17219c8429394ec1bc126b515128572'
          if ! git merge-base --is-ancestor "$version_anchor" HEAD; then
            echo 'Source ref predates the v1.0.0 version anchor; using its fetched tags.'
            exit 0
          fi
          if git show-ref --verify --quiet refs/tags/v1.0.0; then
            test "$(git rev-parse 'v1.0.0^{commit}')" = "$version_anchor"
          else
            git tag v1.0.0 "$version_anchor"
          fi
          git describe --tags --match 'v[0-9]*.[0-9]*.[0-9]*' --long --abbrev=9
      - uses: actions/checkout@v7
        with:
          repository: tasia-ai/tasia-playground
          ref: ${{ github.ref_name }}
          persist-credentials: false
          path: playground
      - name: Rust stable and target
        run: rustup update stable --no-self-update && rustup target add aarch64-apple-darwin
      - name: Build
        working-directory: source
        env:
          CARGO_PROFILE_RELEASE_STRIP: debuginfo
        run: cargo build --release --locked --target aarch64-apple-darwin -p aurora-viewer
      - name: Verify build version
        run: |
          version="$(source/target/aarch64-apple-darwin/release/tasia-viewer --version)"
          if [[ "$version" =~ ^Tasia\ Viewer\ 0\.0\.0([+-]|$) || ! "$version" =~ ^Tasia\ Viewer\ [0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid or placeholder viewer version: $version" >&2
            exit 1
          fi
          echo "macOS arm64 build: $version" >> "$GITHUB_STEP_SUMMARY"
      - name: Package app
        shell: bash
        run: bash ./playground/scripts/package-macos-playground.sh aarch64-apple-darwin arm64
      - name: Upload package to storage.to
        env:
          STORAGE_TO_TOKEN: ${{ secrets.STORAGE_TO_TOKEN }}
        run: |
          shasum -a 256 Tasia-Viewer-macos-arm64.zip > Tasia-Viewer-macos-arm64.zip.sha256
          python3 source/scripts/storage_to_upload.py --directory . --output storage-to-urls-macos-arm64.json
          cat storage-to-urls-macos-arm64.json >> "$GITHUB_STEP_SUMMARY"
