name: Tasia Viewer platform builds

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag, or commit to build from tasia-ai/tasia-rust
        required: true
        default: main
        type: string
  push:
    branches:
      - build/tasia-chat-fix-20261108

permissions:
  contents: read

jobs:
  verify-source:
    name: Verify Tasia features
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          repository: tasia-ai/tasia-rust
          ref: ${{ inputs.source_ref || 'c1bc647f1d27a835127ee7eda71c93d2611e6619' }}
          token: ${{ secrets.TASIA_SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: source
      - name: Check pinned commit and essential Tasia components
        shell: bash
        env:
          EXPECTED_SHA: c1bc647f1d27a835127ee7eda71c93d2611e6619
        run: |
          set -euo pipefail
          actual="$(git -C source rev-parse HEAD)"
          if [[ "${{ github.event_name }}" == "push" && "$actual" != "$EXPECTED_SHA" ]]; then
            echo "::error::Source commit changed unexpectedly: $actual"
            exit 1
          fi
          required=(
            assets/branding/tasia-logo.png
            crates/aurora-net/src/quic_transport.rs
            crates/aurora-viewer/src/native_viewports.rs
            crates/aurora-viewer/src/app/startup_splash.rs
            crates/aurora-viewer/src/tasia_gallery.rs
            crates/aurora-viewer/src/local_bakes.rs
            crates/aurora-viewer/src/media/entry.rs
            crates/aurora-viewer/src/media/update.rs
            scripts/package.ps1
            scripts/storage_to_upload.py
          )
          for path in "${required[@]}"; do
            if [[ ! -f "source/$path" ]]; then
              echo "::error::Missing Tasia component: $path"
              exit 1
            fi
          done
          echo "Source commit: $actual" >> "$GITHUB_STEP_SUMMARY"
          echo "Verified ${#required[@]} expected Tasia files." >> "$GITHUB_STEP_SUMMARY"

  windows-x64:
    needs: verify-source
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: tasia-ai/tasia-rust
          ref: ${{ inputs.source_ref || 'c1bc647f1d27a835127ee7eda71c93d2611e6619' }}
          token: ${{ secrets.TASIA_SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: source
      - name: Rust stable
        run: rustup update stable --no-self-update
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Build
        working-directory: source
        run: cargo build --release --locked -p aurora-viewer
      - name: Package
        shell: pwsh
        run: |
          ./source/scripts/package.ps1 -Exe source/target/release/aurora-viewer.exe -Out Tasia-Viewer-windows-x64 -Source source
          Rename-Item -LiteralPath Tasia-Viewer-windows-x64/aurora-viewer.exe -NewName tasia-viewer.exe
          Compress-Archive -Path Tasia-Viewer-windows-x64 -DestinationPath Tasia-Viewer-windows-x64.zip
          $hash = (Get-FileHash -LiteralPath Tasia-Viewer-windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Tasia-Viewer-windows-x64.zip" | Set-Content -LiteralPath Tasia-Viewer-windows-x64.zip.sha256 -Encoding utf8NoBOM
      - name: Upload package to storage.to
        env:
          STORAGE_TO_TOKEN: ${{ secrets.STORAGE_TO_TOKEN }}
        run: |
          python source/scripts/storage_to_upload.py --directory . --output storage-to-urls-windows.json
          if ($LASTEXITCODE -ne 0) { throw 'storage.to upload failed' }
          Get-Content storage-to-urls-windows.json | Add-Content $env:GITHUB_STEP_SUMMARY

  linux-x64:
    needs: verify-source
    name: Linux x64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          repository: tasia-ai/tasia-rust
          ref: ${{ inputs.source_ref || 'c1bc647f1d27a835127ee7eda71c93d2611e6619' }}
          token: ${{ secrets.TASIA_SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: source
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev
      - name: Rust stable
        run: rustup update stable --no-self-update
      - name: Build
        working-directory: source
        env:
          CARGO_PROFILE_RELEASE_STRIP: debuginfo
        run: cargo build --release --locked -p aurora-viewer
      - name: Test Tasia Chat URL and session identity
        working-directory: source
        run: cargo test --locked -p aurora-viewer ui::tasia_chat::tests
      - name: Package
        shell: pwsh
        run: |
          ./source/scripts/package.ps1 -Exe source/target/release/aurora-viewer -Out Tasia-Viewer-linux-x64 -Source source
          Rename-Item -LiteralPath Tasia-Viewer-linux-x64/aurora-viewer -NewName tasia-viewer
          $desktop = 'Tasia-Viewer-linux-x64/aurora-viewer.desktop'
          (Get-Content -LiteralPath $desktop -Raw).Replace('Exec=aurora-viewer', 'Exec=tasia-viewer') | Set-Content -LiteralPath $desktop -NoNewline
          tar -czf Tasia-Viewer-linux-x64.tar.gz Tasia-Viewer-linux-x64
          sha256sum Tasia-Viewer-linux-x64.tar.gz > Tasia-Viewer-linux-x64.tar.gz.sha256
      - name: Upload package to storage.to
        env:
          STORAGE_TO_TOKEN: ${{ secrets.STORAGE_TO_TOKEN }}
        run: |
          python3 source/scripts/storage_to_upload.py --directory . --output storage-to-urls-linux.json
          cat storage-to-urls-linux.json >> "$GITHUB_STEP_SUMMARY"

  macos-x64:
    needs: verify-source
    name: macOS x64
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7
        with:
          repository: tasia-ai/tasia-rust
          ref: ${{ inputs.source_ref || 'c1bc647f1d27a835127ee7eda71c93d2611e6619' }}
          token: ${{ secrets.TASIA_SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: source
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          repository: tasia-ai/tasia-playground
          ref: ${{ github.ref_name }}
          persist-credentials: false
          path: playground
      - name: Rust stable and target
        run: rustup update stable --no-self-update && rustup target add x86_64-apple-darwin
      - name: Build
        working-directory: source
        env:
          CARGO_PROFILE_RELEASE_STRIP: debuginfo
        run: cargo build --release --locked --target x86_64-apple-darwin -p aurora-viewer
      - name: Package app
        shell: bash
        run: bash ./playground/scripts/package-macos-playground.sh x86_64-apple-darwin x64
      - name: Upload package to storage.to
        env:
          STORAGE_TO_TOKEN: ${{ secrets.STORAGE_TO_TOKEN }}
        run: |
          shasum -a 256 Tasia-Viewer-macos-x64.zip > Tasia-Viewer-macos-x64.zip.sha256
          python3 source/scripts/storage_to_upload.py --directory . --output storage-to-urls-macos-x64.json
          cat storage-to-urls-macos-x64.json >> "$GITHUB_STEP_SUMMARY"

  macos-arm64:
    needs: verify-source
    name: macOS arm64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          repository: tasia-ai/tasia-rust
          ref: ${{ inputs.source_ref || 'c1bc647f1d27a835127ee7eda71c93d2611e6619' }}
          token: ${{ secrets.TASIA_SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: source
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          repository: tasia-ai/tasia-playground
          ref: ${{ github.ref_name }}
          persist-credentials: false
          path: playground
      - name: Rust stable and target
        run: rustup update stable --no-self-update && rustup target add aarch64-apple-darwin
      - name: Build
        working-directory: source
        env:
          CARGO_PROFILE_RELEASE_STRIP: debuginfo
        run: cargo build --release --locked --target aarch64-apple-darwin -p aurora-viewer
      - name: Package app
        shell: bash
        run: bash ./playground/scripts/package-macos-playground.sh aarch64-apple-darwin arm64
      - name: Upload package to storage.to
        env:
          STORAGE_TO_TOKEN: ${{ secrets.STORAGE_TO_TOKEN }}
        run: |
          shasum -a 256 Tasia-Viewer-macos-arm64.zip > Tasia-Viewer-macos-arm64.zip.sha256
          python3 source/scripts/storage_to_upload.py --directory . --output storage-to-urls-macos-arm64.json
          cat storage-to-urls-macos-arm64.json >> "$GITHUB_STEP_SUMMARY"
