name: Tasia Viewer platform builds

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: tasia-ai/tasia-rust
          ref: feat/startup-splash
          token: ${{ secrets.TASIA_SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: source
      - name: Rust stable
        run: rustup update stable --no-self-update
      - name: Build
        working-directory: source
        run: cargo build --release --locked -p aurora-viewer
      - name: Package
        shell: pwsh
        run: |
          ./source/scripts/package.ps1 -Exe source/target/release/tasia-viewer.exe -Out Tasia-Viewer-windows-x64 -Source source
          Compress-Archive -Path Tasia-Viewer-windows-x64 -DestinationPath Tasia-Viewer-windows-x64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: tasia-viewer-windows-x64
          path: Tasia-Viewer-windows-x64.zip
          if-no-files-found: error

  linux-x64:
    name: Linux x64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          repository: tasia-ai/tasia-rust
          ref: feat/startup-splash
          token: ${{ secrets.TASIA_SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: source
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev
      - name: Rust stable
        run: rustup update stable --no-self-update
      - name: Build
        working-directory: source
        env:
          CARGO_PROFILE_RELEASE_STRIP: debuginfo
        run: cargo build --release --locked -p aurora-viewer
      - name: Package
        shell: pwsh
        run: |
          ./source/scripts/package.ps1 -Exe source/target/release/tasia-viewer -Out Tasia-Viewer-linux-x64 -Source source
          tar -czf Tasia-Viewer-linux-x64.tar.gz Tasia-Viewer-linux-x64
      - uses: actions/upload-artifact@v7
        with:
          name: tasia-viewer-linux-x64
          path: Tasia-Viewer-linux-x64.tar.gz
          if-no-files-found: error

  macos-x64:
    name: macOS x64
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7
        with:
          repository: tasia-ai/tasia-rust
          ref: build/macos-x86_64
          token: ${{ secrets.TASIA_SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: source
          fetch-depth: 0
      - name: Rust stable and target
        run: rustup update stable --no-self-update && rustup target add x86_64-apple-darwin
      - name: Build
        working-directory: source
        env:
          CARGO_PROFILE_RELEASE_STRIP: debuginfo
        run: cargo build --release --locked --target x86_64-apple-darwin -p aurora-viewer
      - name: Package app
        shell: bash
        run: ./scripts/package-macos-playground.sh x86_64-apple-darwin x64
      - uses: actions/upload-artifact@v7
        with:
          name: tasia-viewer-macos-x64
          path: Tasia-Viewer-macos-x64.zip
          if-no-files-found: error

  macos-arm64:
    name: macOS arm64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          repository: tasia-ai/tasia-rust
          ref: build/macos-arm64
          token: ${{ secrets.TASIA_SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: source
          fetch-depth: 0
      - name: Rust stable and target
        run: rustup update stable --no-self-update && rustup target add aarch64-apple-darwin
      - name: Build
        working-directory: source
        env:
          CARGO_PROFILE_RELEASE_STRIP: debuginfo
        run: cargo build --release --locked --target aarch64-apple-darwin -p aurora-viewer
      - name: Package app
        shell: bash
        run: ./scripts/package-macos-playground.sh aarch64-apple-darwin arm64
      - uses: actions/upload-artifact@v7
        with:
          name: tasia-viewer-macos-arm64
          path: Tasia-Viewer-macos-arm64.zip
          if-no-files-found: error
